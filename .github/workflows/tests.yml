name: Tests and public demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install in project virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run offline tests
        run: .venv/bin/python -m pytest tests/ -q
      - name: Reproduce public demo
        run: |
          .venv/bin/python examples/create_demo.py --output "$RUNNER_TEMP/cv-scientist-demo"
          .venv/bin/cv-scientist --project "$RUNNER_TEMP/cv-scientist-demo" compare B0 E1 --json
          .venv/bin/cv-scientist --project "$RUNNER_TEMP/cv-scientist-demo" report E1 --baseline B0 --json
