[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-scientist"
version = "0.1.0"
description = "Daily research workspace for computer vision: diagnostics, experiment memory, and scientist agent"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cv-scientist = "cv_scientist.cli:main"

[tool.setuptools.packages.find]
include = ["cv_scientist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
